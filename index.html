<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Job Agent">
<meta name="description" content="Your Job Agent list on your phone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Job Agent</title>
<!-- Job Agent phone app (MOBILE_PLAN.md). Holds no keys or personal data: on first launch it asks for your Supabase
     project URL and publishable key, then your login, and keeps them on this phone. Every read and write is checked by
     Supabase against your login. Edits go to the 'changes' table; Job Agent on your PC applies them at its next sync. -->
<style>
:root{--bg:#f5f4f0;--surface:#fff;--surface2:#eeede8;--fg:#1b1a17;--muted:#5f5b54;--line:#e1dfd8;--line2:#cfccc3;
  --accent:#4353e0;--accent-fg:#fff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--r:12px;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--left:env(safe-area-inset-left,0px);--right:env(safe-area-inset-right,0px)}
/* dark: follows the phone's setting unless you pick Light or Dark under More → Theme */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141311;--surface:#1e1d1a;--surface2:#292724;--fg:#f1efe9;--muted:#a49f94;--line:#33302b;--line2:#48443d;
  --accent:#98a3ff;--accent-fg:#14153a;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
:root[data-theme=dark]{--bg:#141311;--surface:#1e1d1a;--surface2:#292724;--fg:#f1efe9;--muted:#a49f94;--line:#33302b;--line2:#48443d;
  --accent:#98a3ff;--accent-fg:#14153a;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* 16px or more: iOS doesn't zoom in on focus */
a{color:var(--accent)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* frame */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(var(--top) + 10px) calc(var(--right) + 16px) 8px calc(var(--left) + 16px);border-bottom:1px solid var(--line)}
header.top .row{display:flex;align-items:center;gap:10px;min-height:36px}
header.top h1{font-size:20px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:12px calc(var(--right) + 16px) calc(var(--bot) + 84px) calc(var(--left) + 16px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:4px calc(var(--right) + 6px) calc(var(--bot) + 4px) calc(var(--left) + 6px)}
nav.tabs button{flex:1;border:0;background:none;padding:6px 0;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.iconbtn{border:0;background:var(--surface2);border-radius:999px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;gap:6px}
.iconbtn svg{width:20px;height:20px}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);
  background:var(--surface);text-decoration:none;color:var(--fg);font-weight:500}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
textarea.in{min-height:88px;resize:vertical}
.search{position:relative;margin-bottom:10px}
.search .in{padding-left:38px}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--muted);min-height:36px}
.chip b{font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.meta{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;border-radius:6px;padding:2px 8px;background:var(--surface2);color:var(--muted)}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.tag.info{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
/* job list */
.list{list-style:none;margin:0;padding:0}
.job{position:relative;margin-bottom:8px;border-radius:var(--r);overflow:hidden;background:var(--line)}
.job .act{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:600;color:#fff}
.job .act .l{background:var(--ok)} .job .act span{opacity:0}
.job.go-right .act{background:var(--ok)} .job.go-left .act{background:var(--bad)}
.job.go-right .act .r,.job.go-left .act .l{opacity:1}
.job .face{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:12px;touch-action:pan-y;transition:transform .18s ease}
.job .face.drag{transition:none}
.score{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--surface2);color:var(--muted)}
.score.hi{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.score.mid{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.job .t{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.job .s{color:var(--muted);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .tags{margin-top:6px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 12px}
/* sheet (job details, study track) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet header.top{border-bottom:1px solid var(--line)}
.sheet main{padding-bottom:calc(var(--bot) + 32px)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 12px;min-height:38px;font-size:14px}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55;max-height:280px;overflow:hidden;position:relative}
.desc.full{max-height:none}
.iv{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
/* study */
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;width:var(--p);background:var(--accent)}
.row2{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 0;border-bottom:1px solid var(--line)}
.row2:last-child{border-bottom:0}
.row2 .grow{flex:1;min-width:0}
.row2 select{max-width:132px}
.check{width:26px;height:26px;flex:0 0 auto;accent-color:var(--ok)}
.problem.done .grow>div:first-child{color:var(--muted);text-decoration:line-through}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
/* toast */
.toast{position:fixed;left:calc(var(--left) + 12px);right:calc(var(--right) + 12px);bottom:calc(var(--bot) + 76px);z-index:60;background:var(--fg);color:var(--bg);
  border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px}
.toast button{margin-left:auto;border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;min-height:36px}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
/* setup / sign-in */
.auth{max-width:420px;margin:0 auto;padding:calc(var(--top) + 40px) calc(var(--right) + 20px) calc(var(--bot) + 24px) calc(var(--left) + 20px)}
.auth .logo{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin-bottom:16px}
.auth h1{font-size:24px;margin:0 0 6px}
.err{color:var(--bad);font-size:14px;margin:8px 0}
@media (min-width:700px){main,.auth{max-width:680px;margin:0 auto}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- storage (this phone only) ---------- */
const LS={get(k,d){try{const v=localStorage.getItem("ja."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("ja."+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem("ja."+k)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON={search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  jobs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>',
  study:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  sync:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>'};
const STATUSES=["New","Saved","Prepared","Applied","Interview","Offer","Rejected","Skipped"];
const ACTIVE=["New","Saved","Prepared","Applied","Interview"];
const SKIP_REASONS=["Too senior","Wrong stack","Not this company","Location","Pay","Other"];
const CITY={bangalore:"Bengaluru",hyderabad:"Hyderabad",chennai:"Chennai",pune:"Pune",mumbai:"Mumbai",delhi_ncr:"Delhi NCR",remote:"Remote India"};
const LIST_COLS="id,company,title,city,location_raw,work_mode,office_days,salary_text,salary_flag,pay_estimate_lpa,url,apply_url,score,reasons,status,skip_reason,notes,follow_up,interviews,found_at,applied_at,posted_at,closed_at,updated_at";

/* ---------- theme: System (default), Dark or Light ---------- */
let theme=LS.get("theme","system");
function applyTheme(){const r=document.documentElement;if(theme==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{if(!m.dataset.orig)m.dataset.orig=m.content;
    m.content=theme==="dark"?"#141311":theme==="light"?"#f5f4f0":m.dataset.orig})}
applyTheme();

/* ---------- Supabase: sign-in and REST, with the publishable key and your login ---------- */
let cfg=LS.get("cfg",null),session=LS.get("session",null);
class AuthError extends Error{}
async function authCall(grant,body){
  const r=await fetch(cfg.url+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:cfg.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new AuthError(d.error_description||d.msg||d.message||("Sign-in failed (HTTP "+r.status+")"));
  session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,email:(d.user||{}).email||""};
  LS.set("session",session);return session}
async function token(){
  if(!session)throw new AuthError("Signed out");
  if(Date.now()>session.expires_at-60e3){const email=session.email;await authCall("refresh_token",{refresh_token:session.refresh_token});
    if(!session.email){session.email=email;LS.set("session",session)}}
  return session.access_token}
async function rest(path,opt={}){
  const go=async()=>fetch(cfg.url+"/rest/v1/"+path,{method:opt.method||"GET",body:opt.body?JSON.stringify(opt.body):undefined,
    headers:{apikey:cfg.key,Authorization:"Bearer "+await token(),"Content-Type":"application/json",...(opt.headers||{})}});
  let r=await go();
  if(r.status===401&&session){session.expires_at=0;r=await go()}
  if(r.status===401)throw new AuthError("Your sign-in has ended. Sign in again.");
  if(!r.ok){const t=await r.text();throw new Error("Supabase: HTTP "+r.status+" "+t.slice(0,160))}
  const t=await r.text();return t?JSON.parse(t):null}
async function restAll(path){/* Supabase returns at most 1000 rows per request */
  const out=[];for(let from=0;;from+=1000){const rows=await rest(path,{headers:{"Range-Unit":"items",Range:`${from}-${from+999}`}});
    out.push(...rows);if(rows.length<1000)return out}}

/* ---------- data: the cloud copy + your edits not yet applied by the PC ---------- */
let D=LS.get("data",{jobs:[],prog:{},meta:{},pending:[],loadedAt:null});
let queue=LS.get("queue",[]);          // edits made here, not yet sent to Supabase (offline)
let loading=false,loadError="";
async function load(){
  if(loading)return;loading=true;loadError="";render();
  try{
    await flush();
    const [jobs,prog,meta,pending]=await Promise.all([restAll("jobs?select="+LIST_COLS+"&order=score.desc,found_at.desc"),
      restAll("study_progress?select=item,status,note,done_at"),rest("meta?select=key,value"),restAll("changes?select=kind,target,field,value,at&order=at.asc")]);
    D={jobs,prog:Object.fromEntries(prog.map(p=>[p.item,p])),meta:Object.fromEntries((meta||[]).map(m=>[m.key,m.value])),pending,loadedAt:new Date().toISOString()};
    LS.set("data",D);
  }catch(e){if(e instanceof AuthError){signOutLocal();return}loadError=navigator.onLine?e.message:"Offline: showing what was last loaded."}
  finally{loading=false;render()}}
let flushing=null;   // one send at a time: coming back online can fire several triggers at once
function flush(){if(flushing)return flushing;
  flushing=(async()=>{while(queue.length&&navigator.onLine){const batch=queue.slice();
      await rest("changes",{method:"POST",body:batch.map(({kind,target,field,value})=>({kind,target,field,value})),headers:{Prefer:"return=minimal"}});
      D.pending=(D.pending||[]).concat(batch);queue=queue.slice(batch.length);LS.set("queue",queue);LS.set("data",D)}})()
    .finally(()=>{flushing=null});
  return flushing}
/* the job list as it stands with your edits on top */
function edits(){return (D.pending||[]).concat(queue)}
function jobsView(){const by=new Map(D.jobs.map(j=>[String(j.id),{...j}]));
  for(const c of edits())if(c.kind==="job"&&by.has(c.target))by.get(c.target)[c.field]=c.value;return [...by.values()]}
function progView(){const p={};for(const [k,v] of Object.entries(D.prog||{}))p[k]={...v};
  for(const c of edits())if(c.kind==="study"){p[c.target]=p[c.target]||{status:"not started",note:""};p[c.target][c.field]=c.value}return p}
function edit(kind,target,field,value){queue.push({kind,target:String(target),field,value,at:new Date().toISOString()});LS.set("queue",queue);
  render();flush().catch(()=>{})}
const isDone=(p,id)=>["done","needs revision"].includes((p[id]||{}).status);

/* ---------- small helpers ---------- */
const reasonsOf=j=>Array.isArray(j.reasons)?j.reasons:[];
const ivsOf=j=>Array.isArray(j.interviews)?j.interviews:[];
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ago=iso=>{if(!iso)return"";const s=(Date.now()-new Date(iso))/1000;return s<90?"just now":s<3600?Math.round(s/60)+" min ago":s<86400?Math.round(s/3600)+" h ago":Math.round(s/86400)+" d ago"};
const fmtDate=s=>s?new Date(s.length===10?s+"T00:00":s).toLocaleDateString(undefined,{day:"numeric",month:"short"}):"";
const scoreMax=()=>((D.meta||{}).info||{}).score_max||23;
const band=s=>s>=scoreMax()*.6?"hi":s>=scoreMax()*.4?"mid":"";
const modeText=j=>j.work_mode==="remote"?"Remote":j.work_mode==="hybrid"?"Hybrid"+(j.office_days!=null?` · ${j.office_days} d`:""):j.work_mode==="onsite"?"On-site":"";
const simKey=j=>String(j.company||"").toLowerCase().replace(/[^a-z0-9]/g,"")+"|"+String(j.title||"").toLowerCase().replace(/\(.*?\)|\[.*?\]|\b(req|job)?\s*#?\d{4,}\b/g," ").replace(/[^a-z0-9+#]+/g," ").trim();
let toastTimer=null;
function toast(msg,action,fn){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.innerHTML=`<span>${esc(msg)}</span>${action?`<button id="toastAct">${esc(action)}</button>`:""}`;t.classList.remove("hide");
  if(action)$("toastAct").onclick=()=>{t.classList.add("hide");fn()};clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add("hide"),action?6000:2600)}

/* ---------- screens ---------- */
let tab=LS.get("tab","jobs"),fStatus=LS.get("fstatus","active"),fQuery="",sortBy=LS.get("sort","score"),studyView=LS.get("sview","tracks");
let openJob=null,openTrack=null,pf={q:"",pattern:"",list:"",open:false};
function render(){const app=$("app");
  if(!cfg){app.innerHTML=setupHtml();bindSetup();return}
  if(!session){app.innerHTML=signInHtml();bindSignIn();return}
  const keepScroll=openJob||openTrack?null:scrollY;
  app.innerHTML=`<header class="top"><div class="row"><h1>${tab==="jobs"?"Jobs":tab==="study"?"Study":"More"}</h1>
      <button class="iconbtn" id="refresh" aria-label="Refresh">${ICON.sync}${loading?'<span class="meta">…</span>':""}</button></div></header>
    <main id="main">${loadError?`<div class="banner">${esc(loadError)}</div>`:""}${tab==="jobs"?jobsHtml():tab==="study"?studyHtml():moreHtml()}</main>
    <nav class="tabs" aria-label="Sections">${[["jobs","Jobs"],["study","Study"],["more","More"]].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}"${tab===k?' aria-current="page"':""}>${ICON[k]}${l}</button>`).join("")}</nav>
    ${openJob?jobSheet():""}${openTrack?trackSheet():""}`;
  bindMain();if(keepScroll!=null)scrollTo(0,keepScroll)}

/* setup and sign-in */
function setupHtml(){return `<div class="auth"><div class="logo">JA</div><h1>Connect to your data</h1>
  <p class="meta">Once, on this phone: your Supabase project URL and publishable key (Supabase → Project Settings → API Keys). They stay on this phone.</p>
  <form id="setup"><label class="field"><span>Project URL</span><input class="in" id="su" type="url" inputmode="url" autocomplete="off" required placeholder="https://xxxx.supabase.co"></label>
  <label class="field"><span>Publishable key</span><input class="in" id="sk" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="sb_publishable_…"></label>
  <p class="err hide" id="serr"></p><button class="btn primary block">Continue</button></form>
  <p class="meta" style="margin-top:14px">Never the secret key here: that one stays on your PC.</p></div>`}

addEventListener("popstate",()=>{if(openJob||openTrack){openJob=openTrack=null;render()}});
function bindJobSheet(){const j=jobsView().find(x=>x.id===openJob);$("close").onclick=closeSheet;loadDesc(j.id);
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{if(b.dataset.st!==j.status)edit("job",j.id,"status",b.dataset.st)});
  document.querySelectorAll("[data-skip]").forEach(b=>b.onclick=()=>edit("job",j.id,"skip_reason",b.dataset.skip));
  $("fu").onchange=e=>edit("job",j.id,"follow_up",e.target.value||null);
  $("fu7").onclick=()=>{const d=new Date(Date.now()+7*864e5);edit("job",j.id,"follow_up",d.toISOString().slice(0,10));toast("Follow-up set for "+fmtDate(d.toISOString().slice(0,10)))};
  $("pe").onchange=e=>edit("job",j.id,"pay_estimate_lpa",e.target.value===""?null:+e.target.value);
  $("nt").onchange=e=>{if(e.target.value!==(j.notes||""))edit("job",j.id,"notes",e.target.value)};
  $("ivAdd").onclick=()=>{const l=ivCollect();const d=new Date(Date.now()+864e5);l.push({at:d.toISOString().slice(0,10)+"T11:00",round:"",with:"",notes:""});
    edit("job",j.id,"interviews",l);if(["New","Saved","Prepared","Applied"].includes(j.status)){edit("job",j.id,"status","Interview");toast("Status set to Interview.")}};
  document.querySelectorAll("#sheet .iv [data-k]").forEach(i=>i.onchange=()=>edit("job",j.id,"interviews",ivCollect()));
  document.querySelectorAll("[data-ivrm]").forEach(b=>b.onclick=()=>{const l=ivCollect();l.splice(+b.dataset.ivrm,1);edit("job",j.id,"interviews",l)});
  $("dmore").onclick=()=>{const d=$("desc");d.classList.toggle("full");$("dmore").textContent=d.classList.contains("full")?"Show less":"Show all"}}
function bindTrackSheet(){$("close").onclick=closeSheet;
  document.querySelectorAll("[data-item]").forEach(s=>s.onchange=()=>edit("study",s.dataset.item,"status",s.value))}
/* swipe: right = Saved, left = Skipped; a short tap opens the details */
function bindSwipe(li){const face=li.querySelector(".face"),id=+li.dataset.id;let x0=0,y0=0,dx=0,dir=null;
  const open=()=>{openJob=id;history.pushState({s:1},"");render()};
  face.addEventListener("click",()=>{if(dir!=="h")open()});
  face.addEventListener("keydown",e=>{if(e.key==="Enter")open()});
  face.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;dir=null;face.classList.add("drag")},{passive:true});
  face.addEventListener("touchmove",e=>{const mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;
    if(!dir&&(Math.abs(mx)>10||Math.abs(my)>10))dir=Math.abs(mx)>Math.abs(my)?"h":"v";
    if(dir!=="h")return;dx=mx;face.style.transform=`translateX(${dx}px)`;li.classList.toggle("go-right",dx>0);li.classList.toggle("go-left",dx<0)},{passive:true});
  face.addEventListener("touchend",()=>{face.classList.remove("drag");const j=jobsView().find(x=>x.id===id);
    if(dir==="h"&&Math.abs(dx)>90&&j){face.style.transform=`translateX(${dx>0?"110%":"-110%"})`;setTimeout(()=>setStatus(j,dx>0?"Saved":"Skipped"),160)}
    else{face.style.transform="";li.classList.remove("go-right","go-left")}
    setTimeout(()=>{dir=null},50)})}

addEventListener("online",()=>{flush().then(()=>render()).catch(()=>{})});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&session&&(!D.loadedAt||Date.now()-new Date(D.loadedAt)>5*60e3))load()});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();if(cfg&&session)load();
</script>
